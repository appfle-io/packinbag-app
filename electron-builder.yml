appId: io.appfle.packinbag.offline
productName: 팩인백
directories:
  output: dist-desktop
files:
  - "electron/**/*"
  - "package.json"
extraResources:
  - from: ".next/standalone"
    to: "standalone"
win:
  icon: "electron/icon.ico"
  executableName: "팩인백"
  target:
    - target: zip
  artifactName: "Packinbag-offline-win-portable_${version}.${ext}"
mac:
  icon: "electron/icon.png"
  target:
    - target: zip
  artifactName: "Packinbag-offline-mac-portable_${version}.${ext}"
