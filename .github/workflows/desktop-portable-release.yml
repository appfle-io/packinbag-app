name: Build Offline Portable Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*offline*"
      - "v*portable*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} Portable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_cmd: npm run dist:win:portable
            artifact_pattern: "dist-desktop/*.zip"
          - os: macos-latest
            target_cmd: npm run dist:mac:portable
            artifact_pattern: "dist-desktop/*.zip"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        env:
          NEXT_STANDALONE: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDehl5IukN6jpkPDVo9ZJwkKqWclDDkTPI"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "packinbag-f1983.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "packinbag-f1983"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "packinbag-f1983.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "510272302140"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:510272302140:web:a4fdc4f672d1297b7ce739"
        run: npm run build

      - name: Prepare standalone assets
        run: npm run prepare:standalone

      - name: Package with Electron Builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.target_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zip files
        run: |
          mkdir -p release-files
          find artifacts -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Generate Release Body
        run: |
          TAG_NAME="${{ github.ref_name || 'v1.0.3-offline-portable' }}"
          VERSION=$(echo "$TAG_NAME" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Extracting release notes for version $VERSION..."

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; print; next }
            flag && /^## \\[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "## [팩인백 오프라인 무설치 배포판 $TAG_NAME]" > release-body.md
          fi

          cat << 'EOF' >> release-body.md

---

### 다운로드 및 실행 안내
- 하단 **Assets** 영역에서 사용 중인 OS의 압축 파일(.zip)을 다운로드하세요.
- **Windows**: `Packinbag-offline-win-portable_*.zip` (압축 해제 후 `Pack In Bag.exe` 실행)
- **macOS**: `Packinbag-offline-mac-portable_*.zip` (압축 해제 후 `Pack In Bag.app` 실행)

### 주요 특징
- 별도의 설치 과정 없이 즉시 실행되는 포터블 에디션
- 모든 데이터가 내 PC 로컬에 안전하게 보관됨 (인터넷/로그인 불필요)
- 설정 > 데이터 백업 및 복원에서 .json 백업 파일 내보내기/불러오기 지원
EOF

          cat release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.3-offline-portable' }}
          name: "Packinbag Offline Portable ${{ github.ref_name || '1.0.3' }}"
          body_path: release-body.md
          files: release-files/*.zip
          draft: false
          prerelease: false
